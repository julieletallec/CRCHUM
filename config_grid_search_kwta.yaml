# ============================================================
# Configuration complète — GNN + GRU + k-WTA + Pooling
# ============================================================

experiment:
  name: seizure_kwta_experiment
  output_dir: results_grid_search_kwta_20_10_burst_test
  seed: 42
  device: auto               # "cuda", "cpu", ou "auto"
  if_exists: skip            # "skip" ou "overwrite"

# ------------------------------------------------------------
# Données
# ------------------------------------------------------------
data:
  splits_all_train: splits/splits_trainonall_L10_S1.json
  fold_idx: 0
  num_workers: 0
  pin_memory: false
  batch_size: 8

# ------------------------------------------------------------
# Modèle
# ------------------------------------------------------------
model:
  in_dim: auto
  hid: 64

  # --- k-WTA persistante ---
  k_max_ratio: 1.0
  k_max_fixed: null
  k_new_ratio: 1.0
  k_new_fixed: null
  alpha_stay: 0.0
  abs_min: 0.0

  # --- Pooling global ---
  pooling_mode: topk_mean      # mean | max | att_mean | active_mean | topk_mean | noisy_or
  k_ratio: 0.2                 # utilisé pour topk_mean

# ------------------------------------------------------------
# Entraînement
# ------------------------------------------------------------
train:
  epochs: 50
  batch_size: 8
  lr: 1e-3
  weight_decay: 0.0
  grad_clip: 1.0
  amp: true
  ckpt_dir: checkpoints
  if_exists: skip              # skip ou overwrite
  splits: ["train"]
  optimizer: adam


  max_timesteps: 50          # tronquer les séquences temporelles
  max_batches_per_epoch: 200 # limite de batches par epoch (pour le confort)
# ------------------------------------------------------------
# Évaluation
# ------------------------------------------------------------
eval:
  mode: test_only              # test_only | one_per_seizure
  batch_size: 1
  smooth_W: 5
  metrics: [bce, auroc]

  onset:
    method: adaptive           # adaptive | simple
    simple:
      thr: 0.5
      min_stable: 3
    adaptive:
      pre_window: 20
      k_sigma: 2.0
      thr_abs_min: 0.55
      thr_abs_max: 0.85
      frac_of_range: 0.60
      min_stable: 3
      dmin: 0.02

  results_subdir: results
  save_series: true
  series_format: [npz, csv]   # garde les deux pour NPZ + CSV
  save_nodes: true
  series_subdir: series
  save_nodes_wide_csv: true   # <= ajoute ce flag pour écrire le CSV "large"
